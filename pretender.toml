[pretender]
mode = "gate"
languages = ["auto"]
# NOTE: generated/build trees must be excluded with a leading ** glob — bare
# "node_modules/**" does not match the "./node_modules/..." paths the scanner
# walks. That omission made the full gate scan 32k+ vendor findings through
# lefthook's pipe (SIGPIPE 141 on push — tambor-8nt).
exclude = [
  "vendor/**",
  "node_modules/**",
  "**/node_modules/**",
  "target/**",
  "**/target/**",
  "dist/**",
  "**/dist/**",
  "**/*_generated.*",
]

[roles.test]
paths = ["tests/**", "**/*_test.*", "spec/**"]

# Test-role thresholds (tambor-54j.4, following the testaruda repo's
# identical adjustment): pure contract validators under tests/ (e.g.
# bench-stats.ts field checkers) are boolean-heavy by nature — the
# default cyclomatic_max=3 / cognitive_max=5 forces boolean expressions
# to be shredded below readability. Everything else stays at default.

[thresholds.test]
cyclomatic_max = 5
cognitive_max = 6

[roles.library]
paths = ["pkg/**", "lib/**"]

[roles.script]
paths = ["scripts/**", "examples/**"]

[roles.generated]
paths = ["**/*.pb.go", "**/*_generated.*"]

[roles.vendor]
paths = ["vendor/**", "node_modules/**"]
