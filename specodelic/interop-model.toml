source = "interop.model"

[[constraints]]
id = "plain_data_api"
kind = "invariant"
expr = "views, effects, paths, props and events are plain objects, arrays, strings, numbers, booleans and functions, with no class instances, getters, TS enums or non-registered symbols in public data"
traces_to = "[[interop.model]]"

[[constraints]]
id = "string_tags"
kind = "invariant"
expr = "node types and effect types are strings, namespaced tags are written as ns slash name, and the registry treats them as opaque strings"
traces_to = "[[interop.model]]"

[[constraints]]
id = "punctuated_keys"
kind = "invariant"
expr = "state and prop keys may contain question marks, hyphens, dollar signs and slashes such as complete?, next-todo-text and dollar-num, and the library never uses dot access or identifier assumptions on user keys"
traces_to = "[[interop.model]]"

[[constraints]]
id = "nil_is_nullish"
kind = "invariant"
expr = "null and undefined both mean nil and are tested with loose equality to null, and an absent key equals an undefined value"
traces_to = "[[interop.model]]"

[[constraints]]
id = "iterable_inputs"
kind = "invariant"
expr = "every parameter documented as a list accepts any iterable, including the lazy results of squint map and for, and is normalised to an array once at the boundary while outputs are arrays"
traces_to = "[[interop.model]]"

[[constraints]]
id = "variadic_and_array"
kind = "invariant"
expr = "container constructors accept either rest arguments or one array so that apply and direct array calls both work"
traces_to = "[[interop.model]]"

[[constraints]]
id = "free_functions"
kind = "invariant"
expr = "the public API is free functions taking data first, with no methods, builder chains or reliance on this"
traces_to = "[[interop.model]]"

[[constraints]]
id = "functions_opaque"
kind = "invariant"
expr = "handlers, update functions and predicates are called but never inspected, and behaviour never depends on function length or name"
traces_to = "[[interop.model]]"

[[constraints]]
id = "data_ops_seam"
kind = "extension_point"
expr = "every function that reads or writes user state or reads a collection takes an optional ops object with get, assoc, toArray and tag, plus dissoc where deletion is used, defaulting to plain JS operations"
traces_to = "[[interop.model]]"

[[constraints]]
id = "ops_bound_to_app"
kind = "invariant"
expr = "ops are supplied once when an app is created and passed down internally, never held in module-global state, so two apps with different ops can coexist"
traces_to = "[[interop.model]]"

[[constraints]]
id = "seam_keeps_identity"
kind = "invariant"
expr = "with custom ops, branches that were not on an updated path keep reference equality and the input value is not mutated"
traces_to = "[[interop.model]]"

[[constraints]]
id = "tag_namespace_kept"
kind = "invariant"
expr = "the tag operation turns a host keyword into ns slash name, or name when it has no namespace, so a namespaced effect keeps its namespace and means the same from squint, ClojureScript and TypeScript"
traces_to = "[[interop.model]]"

[[constraints]]
id = "no_boundary_conversion"
kind = "invariant"
expr = "crossing the boundary never requires converting state, paths, effects or views between host and JS forms, and a dispatch of one update on a 5000-item state completes in under 1 ms with custom ops"
traces_to = "[[interop.model]]"

[[constraints]]
id = "paths_explicit_api"
kind = "invariant"
expr = "path building is available as plain functions, namely path concatenation, a filter navigator constructor and an each helper that hands each child its value and its path, so the dollar-path derivation is optional"
traces_to = "[[interop.model]]"

[[constraints]]
id = "no_macro_acceptance"
kind = "invariant"
expr = "the counter and todo acceptance scenarios, including deleting from a filtered list, pass using only the explicit path functions"
traces_to = "[[interop.model]]"

[[constraints]]
id = "macro_optional_tier"
kind = "invariant"
expr = "a defui and derivation macro ships as a separate cljc file loadable by squint require-macros and by ClojureScript, desugars to the explicit API, and is never required by the library"
traces_to = "[[interop.model]]"

[[constraints]]
id = "esm_named_exports"
kind = "invariant"
expr = "the package is an ES module with named exports, an exports map and no top-level side effects, so squint and shadow-cljs can import it with a plain require"
traces_to = "[[interop.model]]"

[[constraints]]
id = "advanced_compile_safe"
kind = "invariant"
expr = "node, effect and path property names survive Closure advanced compilation, by shipping externs or by accessing only quoted keys"
traces_to = "[[interop.model]]"

[[constraints]]
id = "dispatch_same_everywhere"
kind = "invariant"
expr = "the same effect vector gives the same state change whether written in TypeScript, squint or ClojureScript"
traces_to = "[[interop.model]]"
