# CI — mirrors the lefthook pre-push gates (see lefthook.yml).
#
# Hard gates (job fails on failure):
#   1. ah check --run-tests   — full spec-test correspondence + contract tests
#   2. pretender check        — gate mode (tambor-8nt briefly downgraded to a
#                               tiered lease while src/ hotspot debt
#                               accumulated; tambor-272 refactored the
#                               hotspots down and gate mode is restored)
#   3. testaruda exec         — select → run → ingest → calibrate loop
#                               (exit 0 = ran and passed, exit 10 = store
#                               uncalibrated, exit 20 = nothing affected —
#                               all benign)
#   4. tsc -p tsconfig.json   — full strict typecheck, noEmit (tambor-j5n).
#                               Vitest strips types, so type errors pass the
#                               suite; the tsconfig.build.json checks that DO
#                               run (p-declarations / p-core-split contract
#                               tests) include only src/** — tests/** and
#                               vitest.config.ts are typechecked by nobody else.
# Non-blocking report:
#   5. tools/scaffold-debt.sh — todo_predicate! scaffold count (always exit 0)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e-smoke:
    name: playwright e2e smoke (tambor-4u6)
    # Real-browser gate: mount.ts's pointer-capture/IME/wheel/focus
    # hardening is only exercised in jsdom locally, which has no layout
    # or real IME (claude.ai chat 773745b6 robustness audit, finding #2).
    # Scope = bench-apps smoke + notebook + risks specs. The notebook-380px
    # overflow that originally excluded notebook.spec.ts was fixed in the
    # 54j.9 wave (guard test notebook.spec.ts:73, 5/5 stable runs) and
    # tambor-194 closed — the spec joined the gate (tambor-194). The
    # gallery spec stays out: the chat saw environment-sensitive gallery
    # failures (3 of 88); it stays out of a blocking gate until triaged.
    # Browser is pinned transitively: package-lock.json pins
    # @playwright/test, and `playwright install chromium` fetches the
    # browser build that exact version expects (author's build).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install pinned Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: playwright install (pinned chromium build)
        run: npx playwright install --with-deps chromium

      # bench-apps smoke + notebook + risks against pinned Chromium, both
      # projects (desktop + mobile-380 — the touch risks need hasTouch).
      - name: playwright e2e smoke
        run: |
          npx playwright test \
            --config tests/e2e/playwright.config.ts \
            bench-apps-smoke.spec.ts notebook.spec.ts risks.spec.ts \
            --project=desktop --project=mobile-380 \
            --reporter=line

  gates:
    name: lefthook-equivalent gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain setup -------------------------------------------------

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'specodelic/**/*.rs', 'versions.ddl.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install gate tools (DDL §4 pins — versions.ddl.toml is the source
        # of truth for these versions; never `latest`)
        uses: taiki-e/install-action@v2
        with:
          tool: espectacular@0.12.0,pretender@0.7.0,testaruda@0.5.5

      - name: Install testaruda adapters (DDL §4 pins — adapter fixes 65e44d7, eb7f44e, 5deee0b)
        # The testaruda release tarballs only bundle the core binary +
        # adapter-rust/adapter-python; tambor needs adapter-typescript (the
        # default adapter for the vitest stack) and adapter-clojure (the
        # experiments/ *.cljc/*.cljs files). Without them, discover finds 0
        # test items and exec exits 20 (tambor-kpx).
        run: |
          # Adapters may already exist when the cargo cache (which includes
          # ~/.cargo/bin) is restored — cargo install refuses to overwrite
          # without --force (first CI run after a cache save failed this way,
          # run 37949866581). The restore-keys fallback can restore a cache
          # saved under an OLDER pin, so presence alone is not freshness:
          # drop the binaries and rebuild from the pinned rev every run
          # (tambor-ci-249 — a stale v0.5.5 adapter-typescript reintroduced
          # the exit-249 empty-output failure after the pin bump).
          rm -f ~/.cargo/bin/testaruda-adapter-typescript \
                ~/.cargo/bin/testaruda-adapter-clojure
          cargo install --locked --quiet \
            --git https://github.com/charly-vibes/testaruda.git --rev 5deee0b \
            adapter-typescript adapter-clojure
          testaruda-adapter-typescript --version 2>/dev/null || true
          testaruda-adapter-clojure --version 2>/dev/null || true

      - name: Install specodelic (spk) — pinned 0.7.0, DDL §4
        # Not in install-action's manifest — install from the canonical §1
        # release tarball with checksum verification. Without spk, `ah sync
        # --check` degrades to spk-unavailable and the contract-drift gate
        # silently stops checking (tambor-41q).
        run: |
          # Download under the canonical asset name — checksums.txt references
          # the asset by that name, so sha256sum -c can locate it.
          spk_tgz="/tmp/specodelic_0.7.0_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/charly-vibes/specodelic/releases/download/v0.7.0/specodelic_0.7.0_linux_amd64.tar.gz" -o "$spk_tgz"
          curl -fsSL "https://github.com/charly-vibes/specodelic/releases/download/v0.7.0/checksums.txt" -o /tmp/spk-checksums.txt
          grep -- specodelic_0.7.0_linux_amd64.tar.gz /tmp/spk-checksums.txt | (cd /tmp && sha256sum -c -)
          tar -xzf "$spk_tgz" -C "$CARGO_HOME/bin" spk
          spk --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- Node setup ------------------------------------------------------
      # package.json may not exist yet (repo bootstrap in flight); tolerate
      # missing manifest and missing lockfile.
      - name: Set up Node
        # vitest 5 declares engines ^22.12.0 || ^24.0.0 || >=26.0.0 — node 20
        # sits outside that range (it happens to run, but unsupported).
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install JS deps (tolerate missing package.json/lockfile)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json yet — skipping JS dependency install"
          fi

      # --- Gates (mirror lefthook pre-push) --------------------------------

      - name: espectacular contracts (ah check --run-tests)
        run: ah check --run-tests

      - name: pretender gate (gate mode — tambor-272)
        run: pretender check --mode gate

      - name: testaruda init (store is machine-local, gitignored — tambor-41q)
        run: testaruda init

      - name: testaruda exec
        # `|| code=$?` (not `cmd; code=$?`): GitHub runs steps with bash -e,
        # so a bare failing command aborts the shell before the tolerance
        # check ever runs. In a `||` context, -e does not fire.
        # Tolerated codes: 0 = selected tests ran and passed; 20 = nothing
        # affected; 10 = store uncalibrated — the CI store is ephemeral
        # (init'd fresh every run), so exec is always a cold first run here.
        # Calibration is non-blocking (tambor-cpd); the pass/fail signal is
        # the ah check --run-tests step. Adapter pinned to the commit that
        # collapses fully-selected files to file-path filters: ~950 per-test
        # vitest CLI filters die on CI node 24 with exit 249 + empty output
        # (diagnosed via three probe runs, tambor-ci-249).
        run: |
          code=0
          testaruda exec || code=$?
          if [ "$code" -eq 0 ] || [ "$code" -eq 10 ] || [ "$code" -eq 20 ]; then exit 0; fi
          echo "testaruda exec failed with exit code $code" >&2
          exit "$code"

      - name: tsc full strict typecheck (tambor-j5n)
        # Same command as `just type-check`. Cheap (~4s) and catches the class
        # of bug vitest cannot: type errors in tests/** and vitest.config.ts
        # (the build-config contract tests cover src/** only).
        run: npx tsc -p tsconfig.json --noEmit

      - name: eslint (tambor-ip9)
        # typescript-eslint: no-floating-promises, switch-exhaustiveness-check,
        # no-unnecessary-condition. Same command as `just lint`.
        run: npx eslint .

      - name: scaffold-debt report (non-blocking)
        run: tools/scaffold-debt.sh

      - name: docs stamp accuracy gate (tambor-cie.5)
        # Regenerate every stamped fact and fail if the committed docs differ —
        # hand-edited numbers (spec counts, pins, bundle size) can no longer drift.
        run: |
          tools/stamp-docs.sh >/dev/null
          git diff --exit-code -- README.md EVALUATION.md \
            || { echo '::error::stamped doc facts are stale — run tools/stamp-docs.sh and commit'; git diff --stat -- README.md EVALUATION.md; exit 1; }
