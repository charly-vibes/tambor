# CI — mirrors the lefthook pre-push gates (see lefthook.yml).
#
# Hard gates (job fails on failure):
#   1. ah check --run-tests   — full spec-test correspondence + contract tests
#   2. pretender check        — gate mode (tambor-8nt briefly downgraded to a
#                               tiered lease while src/ hotspot debt
#                               accumulated; tambor-272 refactored the
#                               hotspots down and gate mode is restored)
#   3. testaruda exec         — select → run → ingest → calibrate loop
#                               (exit 0 = ran and passed, exit 20 = nothing
#                               affected — both benign)
# Non-blocking report:
#   4. tools/scaffold-debt.sh — todo_predicate! scaffold count (always exit 0)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: lefthook-equivalent gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain setup -------------------------------------------------

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'specodelic/**/*.rs') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install gate tools (DDL §4 pins — versions.ddl.toml is the source
        # of truth for these versions; never `latest`)
        uses: taiki-e/install-action@v2
        with:
          tool: espectacular@0.9.3,pretender@0.7.0,testaruda@0.5.1

      - name: Install specodelic (spk) — pinned 0.7.0, DDL §4
        # Not in install-action's manifest — install from the canonical §1
        # release tarball with checksum verification. Without spk, `ah sync
        # --check` degrades to spk-unavailable and the contract-drift gate
        # silently stops checking (tambor-41q).
        run: |
          curl -fsSL "https://github.com/charly-vibes/specodelic/releases/download/v0.7.0/specodelic_0.7.0_linux_amd64.tar.gz" -o /tmp/spk.tgz
          curl -fsSL "https://github.com/charly-vibes/specodelic/releases/download/v0.7.0/checksums.txt" -o /tmp/spk-checksums.txt
          grep "specodelic_0.7.0_linux_amd64.tar.gz" /tmp/spk-checksums.txt | (cd /tmp && sha256sum -c -)
          tar -xzf /tmp/spk.tgz -C "$CARGO_HOME/bin" spk
          spk --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- Node setup ------------------------------------------------------
      # package.json may not exist yet (repo bootstrap in flight); tolerate
      # missing manifest and missing lockfile.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps (tolerate missing package.json/lockfile)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json yet — skipping JS dependency install"
          fi

      # --- Gates (mirror lefthook pre-push) --------------------------------

      - name: espectacular contracts (ah check --run-tests)
        run: ah check --run-tests

      - name: pretender gate (gate mode — tambor-272)
        run: pretender check --mode gate

      - name: testaruda init (store is machine-local, gitignored — tambor-41q)
        run: testaruda init

      - name: testaruda exec
        run: |
          testaruda exec
          code=$?
          if [ "$code" -eq 0 ] || [ "$code" -eq 20 ]; then exit 0; fi
          echo "testaruda exec failed with exit code $code" >&2
          exit "$code"

      - name: scaffold-debt report (non-blocking)
        run: tools/scaffold-debt.sh
