# CI — mirrors the lefthook pre-push gates (see lefthook.yml).
#
# Hard gates (job fails on failure):
#   1. ah check --run-tests   — full spec-test correspondence + contract tests
#   2. pretender check        — tiered mode with dated advisory lease
#                               (tambor-8nt: gate-mode full scan fails on
#                               accumulated src/ hotspot debt; tiered keeps
#                               findings visible and fails closed on lease
#                               expiry — 2026-11-08)
#   3. testaruda exec         — select → run → ingest → calibrate loop
#                               (exit 0 = ran and passed, exit 20 = nothing
#                               affected — both benign)
# Non-blocking report:
#   4. tools/scaffold-debt.sh — todo_predicate! scaffold count (always exit 0)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: lefthook-equivalent gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain setup -------------------------------------------------

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'specodelic/**/*.rs') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install gate tools (ah/espectacular, pretender, testaruda)
        uses: taiki-e/install-action@v2
        with:
          tool: espectacular@0.9.2,pretender@0.7.0,testaruda@0.5.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- Node setup ------------------------------------------------------
      # package.json may not exist yet (repo bootstrap in flight); tolerate
      # missing manifest and missing lockfile.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps (tolerate missing package.json/lockfile)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json yet — skipping JS dependency install"
          fi

      # --- Gates (mirror lefthook pre-push) --------------------------------

      - name: espectacular contracts (ah check --run-tests)
        run: ah check --run-tests

      - name: pretender gate (tiered, dated lease — tambor-8nt)
        run: pretender check --mode tiered --advisory-until 2026-11-08

      - name: testaruda exec
        run: |
          testaruda exec
          code=$?
          if [ "$code" -eq 0 ] || [ "$code" -eq 20 ]; then exit 0; fi
          echo "testaruda exec failed with exit code $code" >&2
          exit "$code"

      - name: scaffold-debt report (non-blocking)
        run: tools/scaffold-debt.sh
