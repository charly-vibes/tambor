# Autonomous TDD + Universal Rule of 5 Review Pipeline
#
# Test-driven implementation workflow with explicit orientation, verification,
# Universal Rule of 5 review, bounded fixes, quality ledger, and wai handoff.
#
# Designed for: autonomous feature implementation, bug fixes, and refactoring
# where correctness must be proven by tests and context must survive agent
# session boundaries.
#
# Usage: wai pipeline start tdd-ro5 --topic="<what you're building>"

[pipeline]
name = "tdd-ro5"
description = "Autonomous TDD implementation loop with Universal Rule of 5 review and wai handoff"

[pipeline.metadata]
when = "Autonomous feature, bugfix, or refactor work where tests and review must gate progress"
skills = ["tdd", "rule-of-5-universal", "commit"]

[[steps]]
id = "orient"
prompt = """
{topic}: Orient before changing anything.

Run:
- `wai prime`
- `wai status`
- `bd ready` if beads is present (note: tambor has no beads DB — if it errors, ignore and proceed without tickets)
- `openspec list` if openspec is present
- `wai search "<topic>"`
- tambor-specific: `ah doctor` (espectacular health), `tools/scaffold-debt.sh` (current todo_predicate! debt),
  and grep `specodelic/*_props.rs` for the predicates relevant to {topic}.

Select exactly one task. A task is normally one contract (`.espectacular/<area>/p-*.toml`)
or one scaffold cluster. If the task is ambiguous, stop and ask. Otherwise proceed autonomously.

Record orientation: `wai add research "ORIENT: ..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps]]
id = "plan"
prompt = """
{topic}: Produce a minimal TDD plan.

Include:
- desired behavior
- out of scope
- test cases to write (name the contract ids being converted from todo_predicate! scaffolds)
- narrow test command: `testaruda exec` (testaruda selects over the espectacular contract bindings)
- full verification command: `ah check --run-tests`
- files likely touched

The tambor loop is: edit corpus `specs/` -> `spk compile` -> deploy -> `ah sync` -> wire tests.
If the behavior under test is not yet stated in the corpus, plan that spec edit first —
the contract TOMLs are derived, never hand-edited.

Do not edit code yet.

Record plan: `wai add plan "..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["plan"]

[[steps]]
id = "red"
prompt = """
{topic}: Write failing tests first.

Rules:
- Convert the target `todo_predicate!` scaffold(s) in `specodelic/*_props.rs` into real
  vitest + fast-check predicates bound to their `.espectacular/<area>/p-*.toml` contracts.
  If the corpus requires editing first, run the loop: edit `specs/` -> `spk compile`
  -> deploy -> `ah sync`.
- Only test files (and regenerated spec artifacts) should change unless test scaffolding
  requires otherwise (e.g. first vitest setup needs package.json).
- Run the narrow test command: `testaruda exec`.
- Confirm failure is for the expected missing behavior (tambor core not yet implemented),
  not setup breakage.

Record evidence: `wai add research "RED: command=... expected failure=..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps]]
id = "green"
prompt = """
{topic}: Implement the minimum production change.

Rules:
- Make the red test pass with the smallest correct change (TypeScript, following the
  membrane-inspired architecture the corpus describes — see README).
- Run the narrow test command: `testaruda exec`.
- Then run the full correspondence check: `ah check --run-tests` (all deployed specs
  and their contract tests must stay green).

Record decision: `wai add design "GREEN: ..."`
Advance: `wai pipeline next`
"""

[[steps.gate.oracles]]
name = "tests-pass"
description = "Relevant tests must pass after green implementation"
timeout = 300

[[steps]]
id = "refactor"
prompt = """
{topic}: Refactor safely while tests stay green.

Allowed:
- simplify names
- remove duplication
- clarify structure
- improve boundaries

Forbidden:
- behavior expansion
- unrelated cleanup
- large architectural rewrites

Run tests after refactoring.

Record refactor note: `wai add design "REFACTOR: ..."`
Advance: `wai pipeline next`
"""

[[steps.gate.oracles]]
name = "tests-pass"
description = "Tests must pass after refactor"
timeout = 300

[[steps]]
id = "ro5u-review"
prompt = """
{topic}: Review the diff using `rule-of-5-universal`.

Review only. Do not fix yet.

Return findings grouped by:
- Critical
- High
- Medium
- Low

Each finding must include:
- file/location
- evidence
- concrete fix

Record review: `wai add review "RO5U: ..."`
Advance: `wai pipeline next`
"""

[steps.gate.procedural]
require_review = true
max_critical = 0

[[steps]]
id = "fix-review"
prompt = """
{topic}: Fix review findings.

Rules:
- Critical/high must be fixed.
- Medium fixed unless explicitly deferred with reason.
- Low fixed if cheap, otherwise tracked.
- Add tests for behavior-impacting fixes.
- Run tests after fixes.

Record fixes: `wai add research "RO5U-FIXES: ..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1

[[steps.gate.oracles]]
name = "tests-pass"
description = "Tests must pass after review fixes"
timeout = 300

[[steps]]
id = "quality-ledger"
prompt = """
{topic}: Produce final quality ledger.

Record exactly:

Changed:
- files and purpose

Verified:
- commands run and result

Review:
- RO5U status and remaining findings

Risks:
- known remaining risks or "none known"

Next:
- exact next action

Record ledger: `wai add research "QUALITY LEDGER: ..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps]]
id = "ship-close"
prompt = """
{topic}: Ship the completed task.

Do:
- inspect `git diff`
- close/update beads issue if applicable
- mark openspec task complete if applicable
- close/update beads issue if applicable (note: tambor has no beads DB — skip if bd errors)
- mark openspec task complete if applicable
- run the tambor loop gates: `ah check --run-tests` and `tools/scaffold-debt.sh` (debt must not grow)
- commit atomically (lefthook runs the commit+push gates: ah check/--run-tests, pretender, testaruda)
- run `wai close`

Project policy (AGENTS.md) mandates push at session completion — push after the
lefthook gates pass and verify origin is up to date.

This step requires human approval: review the ship evidence, then run `wai pipeline approve` when ready.

Pipeline complete.
"""

[[steps.gate.oracles]]
name = "tests-pass"
description = "Final tests must pass before close"
timeout = 300

[[steps.gate.oracles]]
name = "release-docs-fresh"
description = "CHANGELOG newest release matches Cargo.toml version and docs/ has no uncommitted changes"
timeout = 30

[steps.gate.approval]
required = true
message = "Human checkpoint before ship-close — review ship evidence, then run 'wai pipeline approve'"
