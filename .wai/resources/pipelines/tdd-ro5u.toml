# TDD + Universal Rule of 5 implementation pipeline (per ticket), tambor.
#
# One run per beads ticket: orient -> plan -> red -> green -> refactor ->
# ro5u-review -> fix-review -> quality-ledger -> ship-close.
# Adapted from kaya's tdd-ro5u: tambor commands (vitest/just/ah/openspec),
# beads present, author-mode tickets (openspec change authoring) use
# validation evidence in red/green instead of failing tests.
#
# Usage: wai pipeline start tdd-ro5u --topic="<ticket-id> <short title>"

[pipeline]
name = "tdd-ro5u"
description = "Per-ticket TDD implementation with Universal Rule of 5 review and gated ship."

[pipeline.metadata]
when = "Autonomous feature, bugfix, or refactor work where tests and review must gate progress"
skills = ["tdd", "rule-of-5-universal", "commit"]

[[steps]]
id = "orient"
prompt = """
{topic}: Orient on exactly one beads ticket before changing anything.

Run:
- `wai prime`
- `wai status`
- `bd show <ticket>` (and `bd ready` if the ticket is not yet chosen)
- `openspec list --changes` and read the mapped change dir if the ticket
  executes or authors one
- `wai search "<ticket area>"`

Confirm the ticket's metadata (lane, complexity, files, base_commit) and
restate its acceptance criteria as testable statements. If the ticket is
ambiguous or its spec scenario is missing, stop and ask.

Record orientation: `wai add research "ORIENT <ticket>: ..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps]]
id = "plan"
prompt = """
{topic}: Produce the minimal TDD plan for this ticket.

Include:
- desired behavior (openspec scenario ids or ticket acceptance criteria)
- out of scope
- test cases to write first (fixtures and expected failures) — author-only
  tickets instead name the spec deltas and their validation gates
- narrow test command (`npx vitest run <file>`; `testaruda exec` for
  contract-bound selection)
- full verification command (`just test-full`, `ah check --run-tests`,
  `openspec validate <change> --strict` where a change is touched)
- files likely touched (from ticket metadata.files)
- commit shape: feature commit and, separately, any tidy/refactor commit

Do not edit code yet.

Record plan: `wai add plan "PLAN <ticket>: ..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["plan"]

[[steps]]
id = "red"
prompt = """
{topic}: Write failing tests first (execution tickets) or gather
validation evidence (author-only tickets).

Execution tickets:
- Only test files change, unless test scaffolding requires otherwise
  (e.g. a typed options parameter with default behavior, first harness setup).
- When the ticket maps openspec scenarios, declare the espectacular
  contracts first: `ah scenario new <change> <capability> --requirement
  <requirement> "<scenario heading>"`, then bind the vitest test names in
  the generated `.espectacular/<capability>/<slug>.toml` [tests] table.
- Run the narrow test command.
- Confirm the failure is the expected missing behavior, not setup breakage.

Author-only tickets:
- No code. Record the current failing state of the validation gates the
  change must pass (`openspec validate <change> --strict` on the skeleton,
  missing scenarios in `ah check --changes <change>`).

Record evidence: `wai add research "RED <ticket>: command=... expected failure=..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps]]
id = "green"
prompt = """
{topic}: Implement the minimum change.

Execution tickets:
- Make the red tests pass with the smallest correct change.
- Run the narrow test command, then `just test-full`.
- No behavior beyond the ticket's acceptance criteria.
- Keep Purpose/Responsibilities/Rationale file headers current in every
  touched file (repo file-headers convention).

Author-only tickets:
- Complete the openspec change (proposal/design/specs deltas/tasks) until
  `openspec validate <change> --strict` exits 0 and `ah check --changes
  <change>` carries no unexpected findings.

Record decision: `wai add design "GREEN <ticket>: ..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["design"]

[[steps.gate.oracles]]
name = "tests-pass"
description = "Narrow + full tests must pass after green (author tickets: validate --strict + ah check --changes)"
timeout = 600

[[steps]]
id = "refactor"
prompt = """
{topic}: Tidy the result while tests stay green.

Allowed:
- simplify names
- remove duplication
- clarify boundaries and error types
- improve structure without behavior change

Forbidden:
- behavior expansion
- unrelated cleanup
- large architectural rewrites

Run the full suite after refactoring. Keep a material tidy pass in its own
commit; if nothing to tidy, record that explicitly.

Record refactor note: `wai add design "REFACTOR <ticket>: ..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["design"]

[[steps.gate.oracles]]
name = "tests-pass"
description = "Full suite must pass after refactor"
timeout = 600

[[steps]]
id = "ro5u-review"
prompt = """
{topic}: Review the ticket diff using skill `rule-of-5-universal`.

Review only. Do not fix yet.

Cover: correctness vs openspec scenarios/acceptance, invalid states made
unrepresentable, error handling, boundaries/edge cases, allocation/IO cost,
test quality.
Return findings grouped by Critical / High / Medium / Low; each finding needs
file/location, evidence, and a concrete fix.

Record review: `wai add review "RO5U <ticket>: ..."`
Advance: `wai pipeline next`
"""

[steps.gate.procedural]
require_review = true
max_critical = 0

[[steps]]
id = "fix-review"
prompt = """
{topic}: Fix the RO5U findings.

Rules:
- Critical and High must be fixed.
- Medium fixed unless explicitly deferred with a reason.
- Low fixed if cheap, otherwise tracked in a beads ticket.
- Add or adjust tests for behavior-impacting fixes.
- Run `just test-full` after fixes.

Record fixes: `wai add research "RO5U-FIXES <ticket>: ..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1

[[steps.gate.oracles]]
name = "tests-pass"
description = "Full suite must pass after review fixes"
timeout = 600

[[steps]]
id = "quality-ledger"
prompt = """
{topic}: Produce the quality ledger for this ticket.

Record exactly:

Changed:
- files and purpose

Verified:
- commands run and result (`npx vitest run`, `just test-full`,
  `ah check --run-tests`, `openspec validate --strict`)

Review:
- RO5U status and remaining findings

Risks:
- known remaining risks or "none known"

Next:
- exact next action

Record ledger: `wai add research "QUALITY LEDGER <ticket>: ..."`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps]]
id = "ship-close"
prompt = """
{topic}: Ship the completed ticket.

Do:
- inspect `git diff` and stage only this ticket's files
- tick the mapped tasks in the openspec change's tasks.md
- `bd close <ticket>`; verify `.beads/issues.jsonl` exported and tracked
  (`bd export -o .beads/issues.jsonl` + `git add -f .beads/issues.jsonl`
  if the auto-export did not pick it up)
- commit atomically (feature and tidy/refactor commits stay separate;
  lefthook commit gates run: ah check/--run-tests, pretender, testaruda)
- run `tools/scaffold-debt.sh` — debt must not grow

Push policy: tambor AGENTS.md mandates push at session close after the
lefthook pre-push gates pass; per-ticket work commits locally and the
session pushes once at close, verifying origin is up to date.

Record ship: `wai add research "SHIP <ticket>: <commit/ticket state>"`

This step requires human approval: review the ship evidence, then run
`wai pipeline approve` when ready.

Pipeline complete.
"""

[steps.gate.structural]
min_artifacts = 1

[[steps.gate.oracles]]
name = "tests-pass"
description = "Final full suite must pass before close"
timeout = 600

[steps.gate.approval]
required = true
message = "Human checkpoint before ship-close — review ship evidence, then run 'wai pipeline approve'"
