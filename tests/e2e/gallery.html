<!doctype html>
<!-- Purpose: the Playwright fixture page (tambor-y9d.4) — loads the real
     dist/spa.js bundle (same entry index.html loads) with test-only CSS
     that pins the demo surface and the drawn root to a known 300×300
     origin so scripted pointer coordinates (view-space centreOf points)
     map 1:1 onto client coordinates.
     Responsibilities: host #app for the SPA entry; overlay the surface
     canvas on the drawn root so every pointer event lands on the
     surface listener (the corpus wire's input seam — the drawn buttons
     are display-only accessibility mirrors); touch-action none so touch
     drags reach the pointer listeners.
     Rationale: index.html is outside this ticket's ownership set and
     has no surface-origin pinning, so the fixture re-hosts the same
     bundle. The bundle itself is untouched — everything below the
     mount seam is the real artifact. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tambor — gallery (e2e fixture)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; }
      /* overflow-x on the nav itself: the 13-demo nav overflows the
         fixture viewport — without a nav-local scroller, Playwright's
         click on a fully-offscreen nav button scrolls the PAGE right
         and the drawn stage (pinned at x=8) lands offscreen-left, so
         every scripted stage click misses (tambor-54j.13, found by
         the BZ1 bench's op clicks). The nav scrolls within itself;
         the page and the stage origin never move. */
      nav { display: flex; gap: 0.5rem; padding: 0.5rem; overflow-x: auto; }
      nav button { cursor: pointer; }
      nav button.active { font-weight: bold; }
      /* The 300-wide demo stage. Since tambor-huu the drawn root IS the
         input surface (no separate canvas is mounted), so it must stay
         pointer-events-enabled and reach the full 800px stage — the
         old display-only pointer-events:none rule (canvas era) made
         every gallery fixture click fall through to #demo and the SPA
         received nothing (tambor-ibh follow-up, found by the bench
         apps' expectedDrawn assertion). */
      #app { width: 100%; }
      #demo {
        position: relative;
        width: 300px;
        /* min-height 800 keeps the scripted stage stable, but the demo
           must be allowed to GROW: the mount now sizes the drawn root
           to the drawn extent per draw (tambor-8yn), so grown demos
           push the blurb down in normal flow instead of drawing over
           it (the fixed 800px + absolute blurb was the spill). */
        min-height: 800px;
        margin: 0.5rem;
      }
      /* the blurb flows AFTER the drawn root (main.ts appends it post-
         mount), so grown content pushes it down instead of overlapping */
      #demo > p.blurb { width: 380px; }
      #demo > div {
        /* below-fold reach floor: min-height (not height!important) so
           the mount's inline extent height can grow past it while a
           short demo still keeps the full 800px scripted stage */
        min-height: 800px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/demo-dist/spa.js"></script>
  </body>
</html>
