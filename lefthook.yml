# Hard gates — commit and push are blocked on failure.
# Tools: espectacular (ah), pretender, testaruda.
#
# pre-commit: fast, structural checks.
# pre-push:   full execution (contract tests, test selection loop, whole-repo scan).
#
# NOTE: pretender runs via lefthook (single hook owner). Do NOT also run
# `pretender hooks install` — its native shim would fight lefthook for
# .git/hooks/pre-commit. pretender doctor will report the shim as missing;
# that is expected here.
#
# NOTE (tambor-8nt): the full-repo pretender scan runs in tiered mode with a
# dated advisory lease instead of gate mode. Root cause: while the hook was
# silently bypassed (--no-verify during the 8nt SIGPIPE failure), complexity
# debt accumulated in src/ hotspots (worst: effects/paths.ts::walk,
# cyclomatic 116) that no defensible threshold admits — rubber-stamping
# thresholds would gut the gate. Tiered keeps every finding visible and
# colored, but fails CLOSED when the lease expires: renewal is a deliberate,
# dated re-decision, not drift. Restore --mode gate as hotspots are refactored
# down (tracked in the follow-up bead).

pre-commit:
  parallel: true
  jobs:
    - name: espectacular-structural
      run: ah check

    - name: pretender-gate-staged
      run: pretender check --staged --mode gate

    - name: testaruda-config
      run: testaruda doctor

    - name: spec-drift-gate
      # Regenerate deployed specs from the corpus and fail on any diff —
      # an edited corpus file without redeploy cannot slip past the gates.
      run: |
        python3 tools/deploy_specs.py >/dev/null
        git diff --exit-code -- openspec/specs/ || {
          echo "drift: openspec/specs/ is stale — corpus changed without redeploy" >&2
          git --no-pager diff --stat -- openspec/specs/ >&2
          exit 1
        }

    - name: contract-drift-gate
      # CI mode: report derived-contract drift without writing.
      run: ah sync --check

pre-push:
  jobs:
    - name: espectacular-contracts
      run: ah check --run-tests

    - name: pretender-gate-full
      # Tiered + dated advisory lease (see NOTE tambor-8nt above). Fails closed
      # after 2026-11-08 — renew or restore gate mode by refactoring hotspots.
      run: pretender check --mode tiered --advisory-until 2026-11-08

    - name: testaruda-exec
      # exec loop: select → run → ingest → calibrate.
      # Exit 0 = selected tests ran and passed; exit 20 = no tests affected
      # (benign — nothing to run). Any other code blocks the push.
      run: |
        testaruda exec
        code=$?
        if [ "$code" -eq 0 ] || [ "$code" -eq 20 ]; then exit 0; fi
        echo "testaruda exec failed with exit code $code" >&2
        exit "$code"

    - name: scaffold-debt-report
      # Non-blocking: how many predicates are still todo!() scaffolds.
      run: tools/scaffold-debt.sh